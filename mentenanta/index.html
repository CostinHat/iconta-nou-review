<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>iConta — în lucru</title>
<style>
  :root{
    --ardezie:#2b3440; --gri:#5b6573; --gri-clar:#8a929e; --albastru:#3d8fd6;
    --albastru-inchis:#163a5a; --linie:#e2e5ea; --fundal:#f5f6f8; --alb:#ffffff;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; font-family:var(--font); color:var(--ardezie);
    background:var(--fundal);
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .card{
    width:100%; max-width:460px; background:var(--alb);
    border:1px solid var(--linie); border-radius:14px;
    padding:40px 36px; text-align:center;
    box-shadow:0 1px 2px rgba(22,58,90,.04), 0 8px 28px rgba(22,58,90,.06);
  }
  .marca{
    font-size:15px; font-weight:600; letter-spacing:.02em;
    color:var(--albastru-inchis); margin-bottom:28px;
  }
  .marca b{color:var(--albastru)}
  .punct{
    width:44px; height:44px; margin:0 auto 22px; border-radius:50%;
    background:#eaf2fb; display:flex; align-items:center; justify-content:center;
  }
  .punct span{
    width:12px; height:12px; border-radius:50%; background:var(--albastru);
    animation:puls 1.6s ease-in-out infinite;
  }
  @keyframes puls{0%,100%{opacity:.35;transform:scale(.85)}50%{opacity:1;transform:scale(1)}}
  h1{font-size:22px; margin:0 0 12px; font-weight:600; color:var(--ardezie)}
  p{font-size:16px; line-height:1.55; margin:0 0 8px; color:var(--gri)}
  .contact{margin-top:26px; padding-top:20px; border-top:1px solid var(--linie);
           font-size:14px; color:var(--gri-clar)}
  .contact a{color:var(--albastru); text-decoration:none; font-weight:500}
  .contact a:hover{text-decoration:underline}
</style>
</head>
<body>
  <main class="card">
    <div class="marca"><b>i</b>Conta</div>
    <div class="punct"><span></span></div>
    <h1>Aplicația e în lucru</h1>
    <p>Facem o actualizare scurtă. Revenim în curând.</p>
    <p class="contact">Pentru urgențe: <a href="mailto:contact@iconta.eu">contact@iconta.eu</a></p>
  </main>
</body>
</html>
