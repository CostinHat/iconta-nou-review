server {
    server_name 178.105.201.56 iconta.eu www.iconta.eu;
    # --- headere de securitate (11.08.2026) ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=300" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-d4VWMCdi4lnpC3IZZyvvUQolvRbQt7pqeg/RK5Uf/+0=' 'unsafe-hashes' 'sha256-GZIcz60Uwd6wT3vaYke/atSr53TehbYAPepOa3d03Vw='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;
    # --- mentenanta: comuta cu conf.d/maintenance.conf (maintenance/on|off.conf); revert: mentenanta.sh off ---
    error_page 503 @mentenanta;
    location @mentenanta { root /var/www/maintenance; rewrite ^ /_mentenanta.html break; }
    location /static/ {
        if ($show_maint) { return 503; }
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /efactura/callback {
        if ($show_maint) { return 503; }
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /anaf/oauth/callback {
        if ($show_maint) { return 503; }
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ ^/(auth/login|public/magic-link|public/magic-login|public/activare)$ {
        if ($show_maint) { return 503; }
        limit_req zone=iconta_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        if ($show_maint) { return 503; }
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/iconta.eu/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/iconta.eu/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.iconta.eu) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = iconta.eu) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name 178.105.201.56 iconta.eu www.iconta.eu;
    return 404; # managed by Certbot




}
